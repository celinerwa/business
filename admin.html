<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1728">
  <title>Team Admin | Business Management</title>
  <style>
    :root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:#172033;background:#f4f6fa;font-synthesis:none;text-rendering:optimizeLegibility}*{box-sizing:border-box}body{margin:0;min-height:100vh}button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}.login-wrap{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 15% 15%,#1c3b62 0,transparent 42%),#0b1728}.login-card{width:min(420px,100%);padding:38px;background:white;border-radius:18px;box-shadow:0 25px 80px #0004}.brand{font-size:13px;text-transform:uppercase;letter-spacing:.14em;color:#62718a;font-weight:800}.login-card h1{margin:14px 0 8px;font-size:28px}.muted{color:#738096}.field{display:grid;gap:7px;margin:18px 0}.field label{font-size:13px;font-weight:700;color:#39465b}.field input,.field select,.field textarea{width:100%;border:1px solid #d9dfeb;border-radius:9px;padding:11px 12px;background:#fff;color:#172033;outline:none}.field input:focus,.field select:focus,.field textarea:focus{border-color:#4778d0;box-shadow:0 0 0 3px #4778d01a}.primary,.secondary,.quiet{border:0;border-radius:9px;padding:10px 15px;font-weight:700}.primary{background:#2659a8;color:white}.primary:hover{background:#1d4789}.secondary{background:#eaf0fb;color:#214f98}.quiet{background:#f0f2f6;color:#536078}.danger{color:#a93131}.login-card .primary{width:100%;padding:12px}.error{color:#a93131;font-size:13px;margin:10px 0}.app{display:grid;grid-template-columns:244px 1fr;min-height:100vh}.sidebar{background:#0b1728;color:#d9e2f1;padding:26px 18px;display:flex;flex-direction:column;gap:30px}.sidebar .brand{color:#95a9c7;padding:0 10px}.sidebar nav{display:grid;gap:7px}.nav-btn{background:transparent;border:0;color:#acb9cd;text-align:left;padding:12px 13px;border-radius:9px;font-weight:650}.nav-btn:hover,.nav-btn.active{background:#1b2c44;color:white}.sidebar-bottom{margin-top:auto;color:#71829c;font-size:12px;line-height:1.6;padding:10px}.content{min-width:0}.topbar{background:white;border-bottom:1px solid #e5e9f1;padding:17px 30px;display:flex;justify-content:space-between;align-items:center;gap:15px}.topbar h1{font-size:20px;margin:0}.user-area{display:flex;align-items:center;gap:12px;font-size:13px;color:#5d6b80}.main{padding:28px 30px;max-width:1500px;margin:auto}.section-head{display:flex;justify-content:space-between;align-items:flex-start;gap:15px;margin-bottom:20px}.section-head h2{margin:0 0 6px;font-size:24px}.section-head p{margin:0;color:#738096;font-size:14px}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px;margin-bottom:26px}.stat{background:white;border:1px solid #e7eaf0;border-radius:13px;padding:18px}.stat-label{font-size:12px;color:#748199;font-weight:700}.stat-value{font-size:28px;font-weight:800;margin-top:8px}.panel{background:white;border:1px solid #e7eaf0;border-radius:13px;overflow:hidden}.toolbar{display:flex;gap:10px;align-items:center;padding:15px;border-bottom:1px solid #edf0f4;flex-wrap:wrap}.toolbar select,.toolbar input{border:1px solid #d9dfeb;background:white;border-radius:8px;padding:9px 11px;color:#334056}.toolbar input{min-width:220px}.table-wrap{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:700px}th,td{padding:13px 15px;text-align:left;border-bottom:1px solid #edf0f4;font-size:13px;vertical-align:top}th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:#7a879a;background:#fbfcfe}td{color:#354157}tbody tr:last-child td{border-bottom:0}.row-title{font-weight:750;color:#172033}.row-sub{font-size:12px;color:#8290a4;margin-top:4px}.badge{display:inline-flex;padding:5px 9px;border-radius:30px;background:#eef1f6;color:#5a6577;font-size:11px;font-weight:750;text-transform:capitalize}.badge.submitted,.badge.new{background:#fff3d9;color:#986609}.badge.reviewing,.badge.onboarding{background:#e7efff;color:#315da6}.badge.approved,.badge.active,.badge.replied,.badge.completed{background:#e4f6eb;color:#267144}.badge.rejected,.badge.paused{background:#fde9e9;color:#a13b3b}.empty{padding:40px 20px;text-align:center;color:#78859a}.actions{display:flex;gap:7px;flex-wrap:wrap}.small{font-size:11px;padding:7px 9px}.modal-backdrop{position:fixed;inset:0;background:#07142699;display:grid;place-items:center;padding:18px;z-index:5}.modal{background:white;width:min(650px,100%);max-height:92vh;overflow:auto;border-radius:15px;padding:24px;box-shadow:0 24px 70px #0003}.modal-head{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;margin-bottom:14px}.modal h2{font-size:21px;margin:0}.modal-close{border:0;background:#f0f2f6;border-radius:8px;padding:7px 10px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:0 15px}.field.full{grid-column:1/-1}.details{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:17px 0}.detail{padding:12px;background:#f7f8fb;border-radius:9px}.detail strong{display:block;font-size:11px;color:#758197;margin-bottom:5px;text-transform:uppercase}.detail span{font-size:13px;white-space:pre-wrap;overflow-wrap:anywhere}.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:15px}.notice{position:fixed;right:20px;bottom:20px;background:#14243a;color:white;padding:12px 16px;border-radius:9px;box-shadow:0 8px 25px #0002;z-index:8}.mobile-menu{display:none}
    @media(max-width:850px){.app{grid-template-columns:1fr}.sidebar{padding:12px 14px;gap:10px;position:sticky;top:0;z-index:3}.sidebar .brand,.sidebar-bottom{display:none}.sidebar nav{display:flex;overflow:auto}.nav-btn{white-space:nowrap;padding:10px}.topbar{padding:14px 18px}.main{padding:20px 16px}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.stat{padding:14px}.stat-value{font-size:24px}}
    @media(max-width:520px){.topbar{align-items:flex-start}.user-area{font-size:0}.user-area button{font-size:12px}.section-head{align-items:center}.section-head h2{font-size:21px}.stats{gap:9px}.stat-label{font-size:11px}.grid,.details{grid-template-columns:1fr}.field.full{grid-column:auto}.toolbar input{min-width:100%;width:100%}.toolbar select{flex:1}}
  </style>
</head>
<body>
  <section class="login-wrap" id="loginView">
    <form class="login-card" id="loginForm">
      <div class="brand">Celine · Team workspace</div>
      <h1>Admin sign in</h1>
      <p class="muted">Sign in with your team account.</p>
      <div class="field"><label for="loginEmail">Email</label><input id="loginEmail" type="email" autocomplete="username" required></div>
      <div class="field"><label for="loginPassword">Password</label><input id="loginPassword" type="password" autocomplete="current-password" required></div>
      <div id="loginError" class="error" role="alert"></div>
      <button class="primary" type="submit">Sign in</button>
    </form>
  </section>
  <div class="app hidden" id="appView">
    <aside class="sidebar"><div class="brand">Celine · Team workspace</div><nav>
      <button class="nav-btn active" data-page="overview">Overview</button><button class="nav-btn" data-page="requests">Requests</button><button class="nav-btn" data-page="businesses">Businesses</button><button class="nav-btn" data-page="contacts">Contact inbox</button><button class="nav-btn" data-page="team">Team</button>
    </nav><div class="sidebar-bottom">Private team workspace<br>Changes are saved to MongoDB.</div></aside>
    <div class="content"><header class="topbar"><h1 id="pageTitle">Overview</h1><div class="user-area"><span id="adminName"></span><button class="quiet" id="signOut">Sign out</button></div></header><main class="main" id="page"></main></div>
  </div>
  <div class="modal-backdrop hidden" id="modalBackdrop"><section class="modal" id="modal" role="dialog" aria-modal="true"></section></div>
  <div class="notice hidden" id="notice" role="status"></div>
  <script>
    const TOKEN_KEY = 'selemanAdminToken';
    let token = localStorage.getItem(TOKEN_KEY) || '';
    let adminUser = null;
    let activePage = 'overview';
    let cache = { requests: [], businesses: [], contacts: [] };
    const $ = selector => document.querySelector(selector);
    const escapeHtml = value => String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const date = value => value ? new Date(value).toLocaleDateString(undefined,{year:'numeric',month:'short',day:'numeric'}) : '—';
    async function api(path, options = {}) {
      const response = await fetch(path, { ...options, headers: { 'Content-Type':'application/json', ...(token ? {Authorization:`Bearer ${token}`} : {}), ...(options.headers || {}) } });
      const data = await response.json().catch(() => ({}));
      if (!response.ok) { if (response.status === 401 && token) signOut(false); throw new Error(data.error || 'Request failed.'); }
      return data;
    }
    function toast(message) { const box=$('#notice'); box.textContent=message; box.classList.remove('hidden'); setTimeout(()=>box.classList.add('hidden'),3000); }
    async function signIn(email,password) {
      const result=await api('/api/auth/signin',{method:'POST',body:JSON.stringify({email,password})});
      if(!['admin','staff'].includes(result.user.role)) throw new Error('This account does not have team access.');
      token=result.token; localStorage.setItem(TOKEN_KEY,token); adminUser=result.user; showApp(); await navigate('overview');
    }
    function showApp(){ $('#loginView').classList.add('hidden'); $('#appView').classList.remove('hidden'); $('#adminName').textContent=adminUser?.name || ''; }
    function showLogin(){ $('#loginView').classList.remove('hidden'); $('#appView').classList.add('hidden'); }
    async function signOut(callApi=true){ if(callApi&&token) await fetch('/api/auth/signout',{method:'POST',headers:{Authorization:`Bearer ${token}`}}).catch(()=>{}); token='';adminUser=null;localStorage.removeItem(TOKEN_KEY);showLogin(); }
    async function boot(){ if(!token)return showLogin(); try{const result=await api('/api/auth/me');if(!['admin','staff'].includes(result.user.role))throw new Error('Team access required.');adminUser=result.user;showApp();await navigate('overview')}catch{signOut(false)} }
    async function navigate(page){activePage=page;document.querySelectorAll('.nav-btn').forEach(btn=>btn.classList.toggle('active',btn.dataset.page===page));$('#pageTitle').textContent=({overview:'Overview',requests:'Management requests',businesses:'Businesses',contacts:'Contact inbox',team:'Team access'})[page];await renderPage();}
    document.querySelectorAll('.nav-btn').forEach(btn=>btn.addEventListener('click',()=>navigate(btn.dataset.page)));
    $('#signOut').addEventListener('click',()=>signOut());
    $('#loginForm').addEventListener('submit',async event=>{event.preventDefault();$('#loginError').textContent='';try{await signIn($('#loginEmail').value,$('#loginPassword').value)}catch(error){$('#loginError').textContent=error.message}});
    async function renderPage(){const root=$('#page');root.innerHTML='<div class="empty">Loading…</div>';try{
      if(activePage==='overview'){
        const o=await api('/api/admin/overview');
        root.innerHTML=`<div class="section-head"><div><h2>Good to see you, ${escapeHtml(adminUser?.name || 'team')}</h2><p>Review incoming work and keep business accounts up to date.</p></div></div><div class="stats"><div class="stat"><div class="stat-label">All requests</div><div class="stat-value">${o.requestCount}</div></div><div class="stat"><div class="stat-label">Needs attention</div><div class="stat-value">${o.openCount}</div></div><div class="stat"><div class="stat-label">Managed businesses</div><div class="stat-value">${o.businessCount}</div></div><div class="stat"><div class="stat-label">New messages</div><div class="stat-value">${o.newContactCount}</div></div></div><section class="panel"><div class="toolbar"><strong>Recent management requests</strong><button class="secondary small" id="viewRequests">View all</button></div><div id="recentRequests" class="empty">Loading requests…</div></section>`;
        $('#viewRequests').onclick=()=>navigate('requests');const data=await api('/api/admin/requests?limit=5');cache.requests=data.requests;$('#recentRequests').innerHTML=requestTable(data.requests,false);
      } else if(activePage==='requests'){
        const status=new URLSearchParams(location.search).get('status')||'';
        root.innerHTML=`<div class="section-head"><div><h2>Management requests</h2><p>Review submissions, update progress, and convert approved work into a managed business.</p></div></div><section class="panel"><div class="toolbar"><select id="requestFilter"><option value="">All statuses</option>${['submitted','reviewing','approved','rejected','completed'].map(s=>`<option value="${s}" ${s===status?'selected':''}>${s}</option>`).join('')}</select><button class="secondary" id="refresh">Refresh</button></div><div id="requestTable" class="empty">Loading requests…</div></section>`;
        $('#refresh').onclick=loadRequests;$('#requestFilter').onchange=loadRequests;await loadRequests();
      } else if(activePage==='businesses'){
        root.innerHTML=`<div class="section-head"><div><h2>Managed businesses</h2><p>Track client details, service status, and team notes.</p></div><button class="primary" id="newBusiness">＋ Add business</button></div><section class="panel"><div class="toolbar"><input id="businessSearch" type="search" placeholder="Search name, industry, or contact"><button class="secondary" id="refresh">Refresh</button></div><div id="businessTable" class="empty">Loading businesses…</div></section>`;
        $('#newBusiness').onclick=()=>businessModal();$('#refresh').onclick=loadBusinesses;$('#businessSearch').oninput=()=>paintBusinesses();await loadBusinesses();
      } else if(activePage==='contacts'){
        root.innerHTML=`<div class="section-head"><div><h2>Contact inbox</h2><p>Read new enquiries and update their follow-up status.</p></div></div><section class="panel"><div class="toolbar"><button class="secondary" id="refresh">Refresh</button></div><div id="contactTable" class="empty">Loading messages…</div></section>`;
        $('#refresh').onclick=loadContacts;await loadContacts();
      } else {
        root.innerHTML=`<div class="section-head"><div><h2>Team access</h2><p>Create staff logins for trusted team members. Staff can work requests, contacts, and business records.</p></div><button class="primary" id="addMember">＋ Add staff</button></div><section class="panel"><div id="teamTable" class="empty">Loading team…</div></section>`;
        $('#addMember').onclick=()=>teamModal();await loadTeam();
      }
    }catch(error){root.innerHTML=`<div class="panel empty">${escapeHtml(error.message)} <button class="secondary" onclick="renderPage()">Try again</button></div>`}}
    function requestTable(items,actions=true){if(!items.length)return '<div class="empty">No requests found.</div>';return `<div class="table-wrap"><table><thead><tr><th>Business</th><th>Contact</th><th>Service</th><th>Priority</th><th>Status</th><th>Received</th>${actions?'<th></th>':''}</tr></thead><tbody>${items.map(r=>`<tr><td><div class="row-title">${escapeHtml(r.companyName)}</div><div class="row-sub">${escapeHtml(r.industry)}</div></td><td>${escapeHtml(r.contactName)}<div class="row-sub">${escapeHtml(r.email)}</div></td><td>${escapeHtml(r.serviceType)}</td><td>${escapeHtml(r.priority)}</td><td><span class="badge ${escapeHtml(r.status)}">${escapeHtml(r.status)}</span></td><td>${date(r.createdAt)}</td>${actions?`<td><button class="secondary small" data-request="${escapeHtml(r.id)}">Review</button></td>`:''}</tr>`).join('')}</tbody></table></div>`}
    async function loadRequests(){const status=$('#requestFilter').value;const data=await api('/api/admin/requests?limit=200'+(status?'&status='+encodeURIComponent(status):''));cache.requests=data.requests;$('#requestTable').innerHTML=requestTable(data.requests);document.querySelectorAll('[data-request]').forEach(b=>b.onclick=()=>requestModal(cache.requests.find(r=>r.id===b.dataset.request)));}
    function detail(label,value){return `<div class="detail"><strong>${escapeHtml(label)}</strong><span>${escapeHtml(value||'—')}</span></div>`}
    function openModal(html){$('#modal').innerHTML=html;$('#modalBackdrop').classList.remove('hidden')}
    function closeModal(){$('#modalBackdrop').classList.add('hidden')}
    $('#modalBackdrop').addEventListener('click',e=>{if(e.target===$('#modalBackdrop'))closeModal()});
    async function requestModal(r){if(!r)return;openModal(`<div class="modal-head"><div><h2>${escapeHtml(r.companyName)}</h2><div class="row-sub">Request received ${date(r.createdAt)}</div></div><button class="modal-close" id="closeModal">Close</button></div><div class="details">${detail('Contact',r.contactName)}${detail('Email',r.email)}${detail('Phone',r.phone)}${detail('Position',r.position)}${detail('Industry',r.industry)}${detail('Company size',r.companySize)}${detail('Service',r.serviceType)}${detail('Priority',r.priority)}${detail('Budget',r.budgetRange)}${detail('Start date',r.startDate)}${detail('Challenges',r.challenges)}${detail('Objectives',r.objectives)}${detail('Requirements',r.requirements)}</div><div class="grid"><div class="field"><label>Status</label><select id="reqStatus">${['submitted','reviewing','approved','rejected','completed'].map(s=>`<option ${r.status===s?'selected':''}>${s}</option>`).join('')}</select></div><div class="field"><label>Internal team notes</label><textarea id="reqNotes" rows="4" placeholder="Visible to administrators only">${escapeHtml(r.adminNotes||'')}</textarea></div></div><div class="modal-actions"><button class="secondary" id="saveRequest">Save updates</button>${!r.businessId?'<button class="primary" id="convertRequest">Create business record</button>':''}</div>`);
      $('#closeModal').onclick=closeModal;$('#saveRequest').onclick=async()=>{try{await api(`/api/admin/requests/${r.id}`,{method:'PATCH',body:JSON.stringify({status:$('#reqStatus').value,adminNotes:$('#reqNotes').value})});toast('Request updated.');await loadRequestsIfOpen();closeModal()}catch(e){toast(e.message)}};
      const convert=$('#convertRequest');if(convert)convert.onclick=()=>businessModal({name:r.companyName,industry:r.industry,contactName:r.contactName,email:r.email,phone:r.phone,status:'onboarding',serviceType:r.serviceType,notes:`Created from management request.\n\nChallenges: ${r.challenges}\n\nObjectives: ${r.objectives}`,requestId:r.id});
    }
    async function loadRequestsIfOpen(){if(activePage==='requests')await loadRequests();}
    async function loadBusinesses(){const data=await api('/api/admin/businesses?limit=200');cache.businesses=data.businesses;paintBusinesses()}
    function paintBusinesses(){const root=$('#businessTable');if(!root)return;const q=($('#businessSearch')?.value||'').toLowerCase();const items=cache.businesses.filter(b=>[b.name,b.industry,b.contactName,b.email].some(x=>String(x||'').toLowerCase().includes(q)));if(!items.length){root.innerHTML='<div class="empty">No business records yet. Add one or create one from a request.</div>';return}root.innerHTML=`<div class="table-wrap"><table><thead><tr><th>Business</th><th>Primary contact</th><th>Service</th><th>Status</th><th>Updated</th><th></th></tr></thead><tbody>${items.map(b=>`<tr><td><div class="row-title">${escapeHtml(b.name)}</div><div class="row-sub">${escapeHtml(b.industry)}</div></td><td>${escapeHtml(b.contactName)}<div class="row-sub">${escapeHtml(b.email)}</div></td><td>${escapeHtml(b.serviceType)}</td><td><span class="badge ${escapeHtml(b.status)}">${escapeHtml(b.status)}</span></td><td>${date(b.updatedAt)}</td><td><button class="secondary small" data-business="${escapeHtml(b.id)}">Edit</button></td></tr>`).join('')}</tbody></table></div>`;document.querySelectorAll('[data-business]').forEach(button=>button.onclick=()=>businessModal(cache.businesses.find(b=>b.id===button.dataset.business)))}
    function businessModal(b={}){const editing=!!b.id;openModal(`<form id="businessForm"><div class="modal-head"><div><h2>${editing?'Update business':'Add business'}</h2><div class="row-sub">Business details are shared within the admin team.</div></div><button type="button" class="modal-close" id="closeModal">Close</button></div><div class="grid"><div class="field"><label>Business name *</label><input name="name" maxlength="200" required value="${escapeHtml(b.name)}"></div><div class="field"><label>Industry *</label><input name="industry" maxlength="100" required value="${escapeHtml(b.industry)}"></div><div class="field"><label>Primary contact *</label><input name="contactName" maxlength="150" required value="${escapeHtml(b.contactName)}"></div><div class="field"><label>Contact email *</label><input name="email" type="email" maxlength="254" required value="${escapeHtml(b.email)}"></div><div class="field"><label>Phone</label><input name="phone" maxlength="40" value="${escapeHtml(b.phone)}"></div><div class="field"><label>Service</label><input name="serviceType" maxlength="80" value="${escapeHtml(b.serviceType)}"></div><div class="field"><label>Status *</label><select name="status">${['onboarding','active','paused','completed'].map(s=>`<option value="${s}" ${(b.status||'onboarding')===s?'selected':''}>${s}</option>`).join('')}</select></div><div class="field full"><label>Team notes</label><textarea name="notes" rows="5" maxlength="5000">${escapeHtml(b.notes)}</textarea></div></div><div class="modal-actions"><button type="button" class="quiet" id="cancelBusiness">Cancel</button><button class="primary" type="submit">${editing?'Save changes':'Create business'}</button></div></form>`);
      $('#closeModal').onclick=closeModal;$('#cancelBusiness').onclick=closeModal;$('#businessForm').onsubmit=async e=>{e.preventDefault();const form=new FormData(e.target);const data=Object.fromEntries(form.entries());if(b.requestId)data.requestId=b.requestId;try{await api(editing?`/api/admin/businesses/${b.id}`:'/api/admin/businesses',{method:editing?'PATCH':'POST',body:JSON.stringify(data)});toast(editing?'Business updated.':'Business created.');closeModal();await loadBusinesses()}catch(error){toast(error.message)}};
    }
    async function loadContacts(){const data=await api('/api/admin/contacts?limit=200');cache.contacts=data.contacts;const root=$('#contactTable');if(!data.contacts.length){root.innerHTML='<div class="empty">Your inbox is clear.</div>';return}root.innerHTML=`<div class="table-wrap"><table><thead><tr><th>Sender</th><th>Company</th><th>Inquiry</th><th>Message</th><th>Status</th><th>Received</th><th></th></tr></thead><tbody>${data.contacts.map(c=>`<tr><td><div class="row-title">${escapeHtml(c.firstName)} ${escapeHtml(c.lastName)}</div><div class="row-sub">${escapeHtml(c.email)}</div></td><td>${escapeHtml(c.company)}</td><td>${escapeHtml(c.inquiryType)}</td><td>${escapeHtml(c.message.slice(0,110))}${c.message.length>110?'…':''}</td><td><span class="badge ${escapeHtml(c.status)}">${escapeHtml(c.status)}</span></td><td>${date(c.createdAt)}</td><td><select data-contact="${escapeHtml(c.id)}">${['new','read','replied','closed'].map(s=>`<option ${c.status===s?'selected':''}>${s}</option>`).join('')}</select></td></tr>`).join('')}</tbody></table></div>`;document.querySelectorAll('[data-contact]').forEach(select=>select.onchange=async()=>{try{await api(`/api/admin/contacts/${select.dataset.contact}`,{method:'PATCH',body:JSON.stringify({status:select.value})});toast('Message status updated.')}catch(e){toast(e.message)}})}
    async function loadTeam(){const data=await api('/api/admin/team');$('#teamTable').innerHTML=`<div class="table-wrap"><table><thead><tr><th>Name</th><th>Email</th><th>Access</th><th>Added</th></tr></thead><tbody>${data.members.map(m=>`<tr><td><div class="row-title">${escapeHtml(m.name)}${m.id===adminUser.id?' (you)':''}</div></td><td>${escapeHtml(m.email)}</td><td><span class="badge ${m.role==='admin'?'approved':'reviewing'}">${escapeHtml(m.role)}</span></td><td>${date(m.createdAt)}</td></tr>`).join('')}</tbody></table></div>`}
    function teamModal(){openModal(`<form id="teamForm"><div class="modal-head"><div><h2>Add staff member</h2><div class="row-sub">This creates a staff account with access to team work queues.</div></div><button type="button" class="modal-close" id="closeModal">Close</button></div><div class="field"><label>Full name *</label><input name="name" maxlength="100" required></div><div class="field"><label>Email *</label><input name="email" type="email" maxlength="254" required></div><div class="field"><label>Temporary password * (12+ characters)</label><input name="password" type="password" minlength="12" maxlength="128" autocomplete="new-password" required></div><p class="muted">Share the temporary password securely. Staff can sign in at this page.</p><div class="modal-actions"><button type="button" class="quiet" id="cancelTeam">Cancel</button><button class="primary" type="submit">Create staff login</button></div></form>`);$('#closeModal').onclick=closeModal;$('#cancelTeam').onclick=closeModal;$('#teamForm').onsubmit=async e=>{e.preventDefault();const body=Object.fromEntries(new FormData(e.target).entries());try{await api('/api/admin/team',{method:'POST',body:JSON.stringify(body)});toast('Staff login created.');closeModal();await loadTeam()}catch(error){toast(error.message)}}}
    boot();
  </script>
</body>
</html>
